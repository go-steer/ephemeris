name: Deploy Demo to Cloud Run

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'GCP Project ID (falls back to GCP_PROJECT_ID repo variable)'
        required: false
        type: string
      region:
        description: 'Cloud Run Region'
        required: true
        default: 'us-central1'
        type: string
      service_name:
        description: 'Cloud Run Service Name'
        required: true
        default: 'ephemeris-demo'
        type: string
      mode:
        description: 'Operational mode (mock for zero-dependency demo, live for Vertex AI + MCP)'
        required: true
        default: 'mock'
        type: choice
        options:
          - mock
          - live

concurrency:
  group: deploy-cloud-run-${{ inputs.service_name || 'ephemeris-demo' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26'

jobs:
  deploy:
    name: Deploy & Verify on Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run & Run Post-Deployment E2E Verification
        env:
          TARGET_PROJECT: ${{ inputs.project_id || vars.GCP_PROJECT_ID }}
        run: |
          if [[ -z "${TARGET_PROJECT}" ]]; then
            echo "Error: No GCP Project ID specified. Provide project_id input or set GCP_PROJECT_ID repository variable." >&2
            exit 1
          fi
          dev/tools/deploy-cloud-run \
            --project "${TARGET_PROJECT}" \
            --region "${{ inputs.region }}" \
            --service "${{ inputs.service_name }}" \
            --mode "${{ inputs.mode }}"
