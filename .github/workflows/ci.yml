name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26'

jobs:
  test:
    name: test (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Test
        run: dev/ci/presubmits/test-unit
      - name: Build
        run: dev/ci/presubmits/build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: warn

  lint:
    name: lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Format
        run: dev/ci/presubmits/verify-format
      - name: ESLint
        run: dev/ci/presubmits/lint-js
      - name: Stylelint
        run: dev/ci/presubmits/lint-css

  go:
    name: go (vet, build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: '**/go.sum'
      - run: go mod download
      - name: Format
        run: dev/ci/presubmits/verify-go-format
      - name: Vet
        run: dev/ci/presubmits/go-vet
      - name: Build
        run: dev/ci/presubmits/go-build
      - name: Lint
        run: dev/ci/presubmits/lint-go
      - name: Test
        run: dev/ci/presubmits/go-test
      - name: Coverage summary
        run: |
          echo "## Go Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Verify tidy
        run: dev/ci/presubmits/verify-mod-tidy

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Vuln scan
        run: dev/ci/presubmits/verify-vuln
