name: CI (docs-only)

# Companion no-op to ci.yml. ci.yml uses `paths-ignore: ['**/*.md']`, so a
# docs-only change wouldn't produce the test/lint status checks that
# branch protection on `main` requires. This workflow runs on the same
# triggers but matches the inverse paths and emits trivially-green jobs
# with the same names. Net effect: docs-only PRs satisfy required checks
# in ~10s instead of running the full pipeline.

on:
  push:
    branches: [main]
    paths: ['**/*.md']
  pull_request:
    branches: [main]
    paths: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (web)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no web assets to test"

  lint:
    name: lint (web)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no web assets to lint"

  go:
    name: go (vet, build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no Go to build"

  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no Go modules to tidy"

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs-only change — no Go to scan"
